name: Build & Deploy iOS App to App Store Connect

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-and-upload:
    name: Build & Upload to TestFlight / App Store
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java (for any gradle tooling if needed)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: Setup App Store Connect API Key
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          mkdir -p ~/.private_keys
          printf "%s\n" "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_XTBP3CZHG2.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_XTBP3CZHG2.p8 ~/.private_keys/AuthKey_XTBP3CZHG2.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_XTBP3CZHG2.p8
          chmod 600 ~/.private_keys/AuthKey_XTBP3CZHG2.p8
          echo "Key file size:"
          ls -la ~/.appstoreconnect/private_keys/AuthKey_XTBP3CZHG2.p8

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Build Flutter iOS Assets
        run: |
          flutter build ios --release --no-codesign

      - name: Archive with Xcode & App Store Connect API Key
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_XTBP3CZHG2.p8 \
            -authenticationKeyID XTBP3CZHG2 \
            -authenticationKeyIssuerID b9388deb-82d3-4a64-89c1-e6c208202239

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_XTBP3CZHG2.p8 \
            -authenticationKeyID XTBP3CZHG2 \
            -authenticationKeyIssuerID b9388deb-82d3-4a64-89c1-e6c208202239

      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: otr-supermarket-ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 14

      - name: Upload to App Store Connect & TestFlight
        run: |
          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "Uploading $IPA_PATH to App Store Connect..."
          xcrun altool --upload-app \
            --type ios \
            -f "$IPA_PATH" \
            --apiKey XTBP3CZHG2 \
            --apiIssuer b9388deb-82d3-4a64-89c1-e6c208202239
          echo "Successfully uploaded to App Store Connect!"
