name: Build & Deploy iOS App to App Store Connect

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-and-upload:
    name: Build & Upload to TestFlight / App Store
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java (for any gradle tooling if needed)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          mkdir -p ~/.private_keys
          echo "" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_XTBP3CZHG2.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_XTBP3CZHG2.p8 ~/.private_keys/AuthKey_XTBP3CZHG2.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_XTBP3CZHG2.p8
          chmod 600 ~/.private_keys/AuthKey_XTBP3CZHG2.p8
          echo "Key file verified."

      - name: Install Apple Distribution Certificate & Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "buildpassword123"
        run: |
          # 1. Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 2. Import Apple Intermediate CA (G3)
          curl -s https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o AppleWWDRCAG3.cer
          security import AppleWWDRCAG3.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign

          # 3. Import P12
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Set default keychain
          security default-keychain -s $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          # 4. Install Provisioning Profile
          PP_PATH=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PP_PATH"
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH/b4b758bc-54a2-4a77-9599-55d2119e9603.mobileprovision"

          echo "Certificates installed in keychain:"
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Build Flutter iOS Assets
        run: |
          flutter build ios --release --no-codesign

      - name: Archive with Xcode
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: otr-supermarket-ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 14

      - name: Upload to App Store Connect & TestFlight
        run: |
          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "Uploading $IPA_PATH to App Store Connect..."
          xcrun altool --upload-app \
            --type ios \
            -f "$IPA_PATH" \
            --apiKey XTBP3CZHG2 \
            --apiIssuer b9388deb-82d3-4a64-89c1-e6c208202239
          echo "Successfully uploaded to App Store Connect!"
